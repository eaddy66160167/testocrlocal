[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "python -m alembic -c alembic-shared.ini upgrade head"
startCommand = "sh -c 'exec python -m uvicorn app.local_first.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000} --no-access-log'"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
